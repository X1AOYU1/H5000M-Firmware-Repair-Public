name: Build node-free H5000M firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h5000m-public-node-free-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools xz-utils tar python3-yaml python3-cryptography cmake build-essential git jq lua5.1 qemu-user-static strace
      - name: Build fwtool
        run: |
          git clone --depth 1 https://git.openwrt.org/project/fwtool.git /tmp/fwtool-src
          cmake -S /tmp/fwtool-src -B /tmp/fwtool-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/fwtool-build --parallel 2
          sudo install -m 0755 /tmp/fwtool-build/fwtool /usr/local/bin/fwtool
      - name: Install headless browser for HigoOS click audit
        run: |
          npm install --prefix "$RUNNER_TEMP/higoos-ui-audit" --no-audit --no-fund playwright@1.52.0
          "$RUNNER_TEMP/higoos-ui-audit/node_modules/.bin/playwright" install --with-deps chromium
      - name: Download encrypted complete-repair baseline
        run: |
          mkdir -p input
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/full-repair-baseline-encrypted-2026-11-19/H5000M-full-repair-baseline.aesgcm" \
            -o input/full-repair-base.aesgcm
          echo '5c302300b037899abd57e277ade0f9165d9741e05a327ab179caa45ac5881bf3  input/full-repair-base.aesgcm' | sha256sum -c -
      - name: Decrypt complete-repair baseline
        env:
          FULL_REPAIR_BASE_KEY: ${{ secrets.FULL_REPAIR_BASE_KEY }}
        run: |
          test -n "$FULL_REPAIR_BASE_KEY"
          python3 scripts/decrypt-private-baseline.py input/full-repair-base.aesgcm input/full-repair-base.bin "$FULL_REPAIR_BASE_KEY"
          echo '0ef1a767462ea78271d67388421dda5de3b4097a5a786db47dc75276130492e4  input/full-repair-base.bin' | sha256sum -c -
      - name: Test login wallpaper patch
        run: python3 tests/higoros-login-wallpaper-patch.test.py
      - name: Check wallpaper crop module syntax
        run: node --input-type=module --check < scripts/higoos-wallpaper-crop.js
      - name: Test crop preview under HigoOS CSP
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/higoos-ui-audit
        run: node tests/higoos-wallpaper-crop-browser.test.mjs
      - name: Test device vendor lookup
        run: node tests/higoos-device-vendor.test.mjs
      - name: Test wireless presence and topology reconciliation
        run: node tests/higoos-device-live.test.mjs
      - name: Test OpenClash node cleanup
        run: python3 tests/openclash-cleanup.test.py
      - name: Test OpenClash backup importer
        run: python3 tests/openclash-backup-import.test.py
      - name: Test OpenClash manual proxy selection recovery
        run: python3 tests/openclash-proxy-select.test.py
      - name: Test OpenClash Meta core path repair
        run: python3 tests/openclash-meta-core-link.test.py
      - name: Test OpenClash card route
        run: python3 tests/openclash-entry-route.test.py
      - name: Test OpenClash one-click latency test
        run: python3 tests/openclash-bulk-latency.test.py
      - name: Build and verify firmware
        id: firmware_build
        env:
          TZ: Asia/Shanghai
        run: |
          set -o pipefail
          sudo bash scripts/build-public-node-free-wallpaper.sh input/full-repair-base.bin output 2>&1 | tee "$RUNNER_TEMP/firmware-build.log"
      - name: Isolated synthetic HigoOS persistence audit
        continue-on-error: true
        run: sudo unshare --mount --net python3 scripts/audit-higoros-state.py output/final-root
      - name: Test wireless scan security mapping
        run: |
          node scripts/test-uplink-security.mjs
          node --check output/final-root/usr/share/higoros/web/assets/WirelessShellPage-*.js
      - name: Test dashboard refresh intervals in the packed SPA
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/higoos-ui-audit
        run: node tests/higoros-dashboard-refresh-browser.test.mjs output/final-root/usr/share/higoros/web
      - name: Test live device state and topology in the packed SPA
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/higoos-ui-audit
        run: node tests/higoos-device-live-browser.test.mjs output/final-root/usr/share/higoros/web
      - name: Inspect wireless repeater password controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = Path('output/final-root/usr/share/higoros/web/assets')
          for p in assets.glob('*.js'):
              s = p.read_text(encoding='utf-8')
              for term in ('热点密码', '选择要中继的热点'):
                  i = s.find(term)
                  if i >= 0:
                      print('ASSET', p.name, 'TERM', term, 'CONTEXT', s[max(0,i-2200):i+900])
          PY
      - name: Preserve dashboard assets for refresh diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-analysis-${{ github.run_id }}
          path: output/final-root/usr/share/higoros/web/assets/*.js
          retention-days: 1
      - name: Preserve wireless asset for analysis
        uses: actions/upload-artifact@v4
        with:
          name: wireless-analysis-${{ github.run_id }}
          path: output/final-root/usr/share/higoros/web/assets/WirelessShellPage-*.js
          retention-days: 1
      - name: Preserve firmware build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-firmware-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/firmware-build.log
            output/openclash-meta-core-link.txt
            output/openclash-backup-import.txt
            output/openclash-proxy-select.txt
            output/openclash-bulk-latency.txt
            output/firmware-verification.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Restore both profiles with the packed ARM64 BusyBox
        run: sudo python3 tests/openclash-firmware-restore.test.py output/final-root
      - name: Test authenticated device remarks through LuCI
        run: sudo python3 tests/higoos-device-remarks.test.py output/final-root
      - name: Test authenticated wireless snapshots through LuCI
        run: sudo python3 tests/higoos-device-wireless.test.py output/final-root
      - name: Dynamically click OpenClash app-center entry
        id: openclash_browser_audit
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/higoos-ui-audit
          AUDIT_DIR: ${{ runner.temp }}/higoos-openclash-audit
        run: |
          mkdir -p "$AUDIT_DIR"
          sudo install -m 0644 output/final-root/usr/lib/lua/luci/view/openclash/status.htm "$AUDIT_DIR/native-status.htm"
          sudo install -m 0644 output/final-root/usr/lib/lua/luci/view/openclash/upload.htm "$AUDIT_DIR/native-upload.htm"
          sudo install -m 0644 output/final-root/usr/lib/lua/luci/view/openclash/h5000m_geo_update.htm "$AUDIT_DIR/native-geo-update.htm"
          set +e
          node tests/openclash-entry-browser.test.mjs output/final-root/usr/share/higoros/web "$AUDIT_DIR/openclash-entry-browser.txt" "$AUDIT_DIR/native-status.htm" "$AUDIT_DIR/native-upload.htm" "$AUDIT_DIR/native-geo-update.htm" > "$AUDIT_DIR/openclash-entry-browser-process.log" 2>&1
          result=$?
          if [ ! -f "$AUDIT_DIR/openclash-entry-browser.txt" ]; then
            cp "$AUDIT_DIR/openclash-entry-browser-process.log" "$AUDIT_DIR/openclash-entry-browser.txt"
          fi
          cat "$AUDIT_DIR/openclash-entry-browser-process.log"
          exit "$result"
        continue-on-error: true
      - name: Preserve OpenClash browser audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-openclash-browser-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/higoos-openclash-audit/openclash-entry-browser.txt
            ${{ runner.temp }}/higoos-openclash-audit/openclash-entry-browser-process.log
          if-no-files-found: warn
          retention-days: 7
      - name: Require successful OpenClash browser audit
        if: always()
        run: |
          test "${{ steps.openclash_browser_audit.outcome }}" = success || test "${{ steps.openclash_browser_audit.conclusion }}" = success
          grep -q '^PASS: HigoOS app-center OpenClash button was clicked' "${{ runner.temp }}/higoos-openclash-audit/openclash-entry-browser.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: H5000M-complete-repair-node-free-firmware
          path: |
            output/H5000M-6.6.160-full-repair-NO-NODES.bin
            output/SHA256SUMS.txt
            output/firmware-size.txt
            output/firmware-verification.txt
            output/metadata.json
            output/metadata-extracted.json
            output/login-wallpaper-fix.txt
            output/openclash-backup-import.txt
            output/openclash-proxy-select.txt
            output/openclash-bulk-latency.txt
            output/openclash-entry-route.txt
            ${{ runner.temp }}/higoos-openclash-audit/openclash-entry-browser.txt
            output/openclash-node-cleanup.txt
            output/frontend-asset-revision.txt
          retention-days: 30
      - name: Publish verified firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h5000m-complete-repair-node-free
          name: H5000M complete repair, node-free
          body: >-
            Built from the complete repair baseline. OpenClash and PassWall
            open native LuCI inside the HigoOS layout. OpenClash backup imports
            restore and verify profiles, and each GEO update runs without reloading settings.
            Device notes are stored independently of device names. The previous HigoOS address
            remains available with filtered backup import;
            proxy nodes and subscription credentials were removed. Other
            firmware repairs and H5000M upgrade metadata were verified.
            Automated validation does not replace testing on a physical H5000M.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            output/H5000M-6.6.160-full-repair-NO-NODES.bin
            output/SHA256SUMS.txt
            output/firmware-size.txt
            output/firmware-verification.txt
            output/metadata.json
