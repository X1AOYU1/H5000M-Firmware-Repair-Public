name: Build node-free H5000M firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5000m-public-node-free-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools xz-utils tar python3-yaml
      - name: Download node-free baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/766539561 \
            -o input/node-free-base.bin
          echo '411c4f83208d62144d8556adc54bcb3bdd5291279cc34bec7095d32e3f851806  input/node-free-base.bin' | sha256sum -c -
      - name: Build and verify firmware
        env:
          TZ: Asia/Shanghai
        run: |
          python3 tests/higoros-login-wallpaper-patch.test.py
          sudo bash scripts/build-public-node-free-wallpaper.sh input/node-free-base.bin output
      - uses: actions/upload-artifact@v4
        with:
          name: H5000M-node-free-login-wallpaper-firmware
          path: |
            output/H5000M-6.6.160-login-wallpaper-NO-NODES.bin
            output/SHA256SUMS.txt
            output/firmware-size.txt
            output/firmware-verification.txt
            output/login-wallpaper-fix.txt
            output/frontend-asset-revision.txt
          retention-days: 30
